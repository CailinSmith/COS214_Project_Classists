name: CI

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make valgrind

      - name: Build project
        run: make all

      - name: Run unit tests
        run: make test

      - name: Run Valgrind
        run: make memcheck